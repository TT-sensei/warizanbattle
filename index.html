<style>

shadow:0 3px 0 #e8d49c}.badge img{width:72px;height:72px;object-fit:contain;display:block;margin:auto;filter:grayscale(1) opacity(.22)}.badge.found img{filter:drop-shadow(0 2px 2px #0004)}.badge b{display:block;font-size:12px;margin-top:2px}.badge small{color:#6b7b88}.modal-close{border:0;border-radius:10px;background:#e9f0f6;padding:9px 15px;font-weight:800}@media(max-width:500px){.hero-choices{grid-template-columns:repeat(3,1fr)}.hero-choice img{height:58px}}.record{margin:14px auto;background:#ffffffdf;border:2px solid #c4dceb;border-radius:16px;padding:10px;max-width:480px}.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.level-card{border:3px solid #d6e4ee;background:#fffffff0;border-radius:18px;padding:14px 8px;min-height:128px}.level-card.selected{border-color:#2774d8;background:#eef7ff;box-shadow:0 5px 0 #bfd7ee}.level-card b{display:block;font-size:18px}.level-card small{display:block;margin-top:7px;line-height:1.45}.start{margin-top:16px;font-size:21px;padding:13px 34px}

.battle{--battle-bg:url('https://tt-sensei.github.io/navi-character-/assets/web/fantasy/backgrounds/forest.webp');flex:1;min-height:0;display:grid;grid-template-columns:minmax(78px,.8fr) minmax(250px,3.5fr) minmax(78px,.8fr);align-items:end;gap:8px;padding:10px;background:linear-gradient(#ffffff55,#ffffff55),var(--battle-bg) center/cover}.fighter{text-align:center;align-self:stretch;display:flex;flex-direction:column;justify-content:end;min-width:0}.fighter img{display:block;margin:auto auto 0;width:100%;height:clamp(88px,19vw,190px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 3px #0005);transition:transform .16s,opacity .16s}.fighter.hero img{transform:scale(.9)}.fighter.attack img{transform:scale(1.20)}.fighter.attack-burst img{transform:scale(1.35) translateX(8px)}.fighter.special img{transform:scale(1.28)}.fighter.special-burst img{transform:scale(1.45) translateX(10px)}.fighter.damage img{animation:shake .28s}.fighter small{display:block;background:#ffffffdd;border-radius:999px;font-size:11px;font-weight:800;padding:2px 5px;margin-top:2px}.hp{height:11px;border:2px solid #fff;background:#4b5563;border-radius:99px;overflow:hidden;margin:4px auto;width:88%;box-shadow:0 1px 3px #0004}.hp i{display:block;height:100%;background:#df5656;width:100%;transition:.25s}.hero .hp i{background:#31b77a}.board-card{align-self:center;background:#fffdf8ed;border:3px solid #6683a0;border-radius:17px;padding:clamp(6px,2vw,16px);box-shadow:0 6px 0 #5a789988;overflow:auto;max-width:100%;backdrop-filter:blur(2px)}.board{--unit:clamp(38px,8vw,70px);display:grid;grid-auto-rows:var(--unit);min-width:max-content;position:relative}.cell{width:var(--unit);height:var(--unit);display:flex;align-items:center;justify-content:center;border-right:1px solid #e2ebf2;border-bottom:1px solid #e2ebf2;font-size:clamp(24px,5.5vw,45px);font-weight:800;position:relative}.source{color:var(--blue)}.q{color:#7d4a15}.partial{color:var(--green)}.remain{color:var(--red)}.bracket{border-top:3px solid var(--ink);justify-content:flex-start}.bracket:before{content:'）';position:absolute;left:-16px;top:-2px;font-size:clamp(30px,6vw,54px)}.topline,.subline{border-top:3px solid var(--ink)}.focus{background:var(--yellow);outline:3px solid #f0c943;z-index:2}.down:after{content:'↓';position:absolute;font-size:18px;color:#147eb5;top:-5px;right:2px}.side-panel{display:contents}.msg{min-height:58px;background:#fff;padding:9px 14px;text-align:center;font-weight:800;font-size:clamp(15px,3.4vw,20px);border-top:2px solid #c5dfef}.answer{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;padding:8px 12px;border-top:1px solid #dce7ef}.answer-box{min-width:94px;text-align:center;border:3px dashed #8aa3b7;border-radius:10px;font-size:27px;padding:3px 10px;letter-spacing:3px;height:45px}.answer-box.bad{border-color:#df6262;background:#fff0f0;animation:shake .25s}.answer-box.ok{border-color:#43aa78;background:#effaf4}.keys{background:#edf3f8;padding:8px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.key{border:0;border-radius:12px;background:#fff;height:49px;font-size:21px;box-shadow:0 3px 0 #afc5d5}.key.enter{background:#39b477;color:#fff}.key.erase{background:#a4b3bf;color:#fff}.toast{position:fixed;top:112px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 18px;border-radius:999px;background:#1f3650;color:#fff;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.result{position:fixed;inset:0;background:#18334bc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.result.show{display:flex}.result-card{background:#fffdf8;text-align:center;border-radius:22px;padding:26px;max-width:360px;width:100%;box-shadow:0 10px 40px #0005}.result-hero{height:190px;max-width:100%;object-fit:contain;transform:scale(1.12)}.result h2{margin:4px 0;color:#e27d22}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:500px){.party{height:90px}.party img{height:80px}.level-grid{gap:6px}.level-card{padding:10px 4px;min-height:118px}.level-card b{font-size:15px}.battle{grid-template-columns:62px minmax(0,1fr) 68px;padding:5px}.fighter img{height:100px}.fighter.attack img{transform:scale(1.28)}.fighter.attack-burst img{transform:scale(1.42) translateX(6px)}.fighter.special img{transform:scale(1.34)}.fighter.special-burst img{transform:scale(1.50) translateX(7px)}.keys{gap:5px}.key{height:45px;font-size:19px}}
@media(orientation:landscape) and (min-width:760px){#game{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,32vw);grid-template-rows:auto auto minmax(0,1fr);min-height:100svh}#game>.top{grid-column:1/-1}#game>.steps{grid-column:1/-1}#game>.battle{grid-column:1;grid-row:3;min-width:0;overflow:auto}#game>.side-panel{grid-column:2;grid-row:3;display:flex;flex-direction:column;border-left:2px solid #c5dfef;background:#fff;overflow:auto}.side-panel>.msg{flex:1;display:flex;align-items:center;justify-content:center;border-top:0}.side-panel>.answer{flex-wrap:wrap}.side-panel>.keys{grid-template-columns:repeat(4,1fr)}.fighter img{height:clamp(120px,27vh,210px)}.fighter.attack img{transform:scale(1.22)}.fighter.attack-burst img{transform:scale(1.38) translateX(9px)}.fighter.special img{transform:scale(1.30)}.fighter.special-burst img{transform:scale(1.48) translateX(11px)}}

<body>
<main id="home" class="screen active"><div class="home-inner">
<h1 class="logo">わり算バトル</h1><p class="sub">ファンタジーの世界で「たてる・かける・ひく・おろす」をマスター！</p>
<div class="party" aria-hidden="true"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/sora-swordsman.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/riku-ninja.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/kai-mage.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/tsuki-archer.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/nami-guardian-knight.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/fantasy/saku-cleric-healer.webp"></div>
<button id="startHero" class="start-hero">冒険をはじめる</button><div class="record">🏅 最高コンボ：<span id="best">0</span>　⭐ クリア：<span id="clears">0</span></div>
<div class="level-grid" id="levels"><button class="level-card selected" data-level="1"><b>🌳 はじめの森</b><small>2けた ÷ 1けた<br>あまりなし<br>雑魚モンスター</small></button><button class="level-card" data-level="2"><b>💎 あまりの洞くつ</b><small>2・3けた ÷ 1けた<br>あまりあり<br>中ボスクラス</small></button><button class="level-card" data-level="3"><b>🏰 名人の遺跡</b><small>3けた ÷ 1けた<br>商に0も出る<br>ドラゴン戦</small></button></div>
<button id="start" class="start">この世界へ</button></div></main>
<main id="game" class="screen"><div class="top"><button id="homeBtn" class="back">← もどる</button><span class="progress" id="progress"></span><span class="stars" id="combo">⚡ 0 コンボ</span><button id="soundToggle" class="soft">🔊</button></div><div class="steps"><span class="step-chip" data-kind="tateru">① たてる</span><span class="step-chip" data-kind="kakeru">② かける</span><span class="step-chip" data-kind="hiku">③ ひく</span><span class="step-chip" data-kind="orosu">④ おろす</span></div>
<section id="battle" class="battle"><aside id="heroFighter" class="fighter hero"><img id="heroArt" alt="冒険者"><div class="hp"><i id="heroHp"></i></div><small id="heroName">冒険者</small></aside><div class="board-card"><div id="board" class="board"></div></div><aside id="enemyFighter" class="fighter"><img id="enemyArt" alt="モンスター"><div class="hp"><i id="enemyHp"></i></div><small id="enemyName">モンスター</small></aside></section>
<div class="side-panel"><div id="message" class="msg"></div><div class="answer"><b>こたえ</b><div id="answer" class="answer-box">　</div><button id="hint" class="soft">ヒント</button></div><div class="keys" id="keys"></div></div><div id="toast" class="toast"></div></main>
<div id="result" class="result"><div class="result-card"><img id="resultHero" class="result-hero" alt=""><h2>バトルクリア！</h2><p id="resultText"></p><button id="again" class="start">つぎのバトルへ</button><br><button id="resultHome" class="soft" style="margin-top:12px">ホームへ</button></div></div>
<script type="module">
import {soundList} from 'https://tt-sensei.github.io/sounds-recipe-/sounds.js';
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],ROOT='https://tt-sensei.github.io/navi-character-/assets/web/fantasy/';
let audioCtx=null,soundEnabled=localStorage.getItem('warizanBattleSound')!=='off';
function sound(id,v=.14){if(!soundEnabled)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();soundList.find(x=>x.id===id)?.play(audioCtx,v)}catch(e){}}
const HEROES=[
{name:'そら・剣士',stand:'sora-swordsman.webp',attack:'attack/sora-swordsman-attack.webp'},
{name:'りく・忍者',stand:'riku-ninja.webp',attack:'attack/riku-ninja-attack.webp'},
{name:'かい・魔導士',stand:'kai-mage.webp',attack:'attack/kai-mage-attack.webp'},
{name:'つき・アーチャー',stand:'tsuki-archer.webp',attack:'attack/tsuki-archer-attack.webp'},
{name:'なみ・騎士',stand:'nami-guardian-knight.webp',attack:'attack/nami-knight-attack.webp'},
{name:'さく・僧侶',stand:'saku-cleric-healer.webp',attack:'attack/saku-cleric-attack.webp'}];
const WORLDS={1:{bg:'backgrounds/forest.webp',enemies:[['森ぷる','monsters/zako/forest-puru.webp'],['どんぐりリーフ','monsters/zako/acorn-leafy.webp'],['こもりん','monsters/zako/komorin-little-night-bat.webp'],['あきいろキノコ','monsters/zako/autumn-mushroom.webp'],['ベリーリーフ','monsters/zako/berry-leafy.webp'],['もふもふフロスト','monsters/zako/ember-frost-pup.webp'],['はっぱリス','monsters/zako/happa-squirrel-leafy.webp'],['ひのこイモリ','monsters/zako/hinoko-ember-newt.webp'],['りんごキノコ','monsters/zako/kinoko-apple-mushroom.webp'],['ころゴーレム','monsters/zako/koro-golem-pebble-golem.webp'],['もふウルフ','monsters/zako/mofu-wolf-frost-pup.webp'],['モスころゴーレム','monsters/zako/moss-pebble-golem.webp'],['よるぽん','monsters/zako/night-snow-puff.webp'],['ぷるん','monsters/zako/purun-little-magic-slime.webp'],['あめコウモリ','monsters/zako/rainy-bat.webp'],['さくらぽん','monsters/zako/sakura-snow-puff.webp'],['すなイモリ','monsters/zako/sand-ember-newt.webp'],['ゆきキノコ','monsters/zako/snow-mushroom.webp']]},2:{bg:'backgrounds/cave.webp',enemies:[['クリスタルゴーレム','monsters/boss/crystal-golem.webp'],['ゆめねこ魔導士','monsters/boss/dream-cat-mage.webp'],['あかつきねこ魔導士','monsters/boss/dawn-cat-mage.webp'],['プリズムゴーレム','monsters/boss/prism-crystal-golem.webp'],['つきかげゴーレム','monsters/boss/moon-crystal-golem.webp'],['森のツノキング','monsters/boss/forest-horn-king.webp'],['こけいろツノキング','monsters/boss/moss-ruin-horn-king.webp'],['フロストクリスタルライオン','monsters/boss/frost-crystal-lion.webp'],['サンダーグリフォン','monsters/boss/thunder-griffon.webp'],['空の遺跡グリフォン','monsters/boss/sky-ruin-griffon.webp'],['たいようグリフォン王','monsters/boss/solar-griffon-king.webp'],['火山イノシシ王','monsters/boss/volcano-boar-king.webp'],['よいやみねこ魔導士','monsters/boss/twilight-cat-mage.webp']]},3:{bg:'backgrounds/ruins.webp',enemies:[['蒼天ドラゴン','monsters/boss/sky-ruin-griffon.webp'],['紅蓮ドラゴン','monsters/boss/flare-leo.webp'],['黄昏フェニックス','monsters/boss/eclipse-shadow-phoenix.webp'],['月光フェニックス','monsters/boss/lumina-moon-phoenix.webp'],['星喰いノクステラ','monsters/boss/noxstella-star-eater.webp']]}};
const state={level:1,question:0,total:5,steps:[],index:0,answer:'',combo:0,maxCombo:0,misses:0,hero:100,enemy:100,model:null,heroData:null,attackTimer:null};\nlet selectedHero=Number(localStorage.getItem('warizanSelectedHero')||0);\nconst allMonsters=Object.values(WORLDS).flatMap(w=>w.enemies);\nfunction monsterKey(e){return e[1]}\nfunction collection(){return JSON.parse(localStorage.getItem('warizanMonsterBadges')||'{}')}\nfunction unlockMonster(e){const d=collection(),k=monsterKey(e);d[k]=(d[k]||0)+1;localStorage.setItem('warizanMonsterBadges',JSON.stringify(d))}\nfunction renderHeroChoices(){const box=$('#heroChoices');if(!box)return;box.innerHTML=HEROES.map((h,i)=>`<button class="hero-choice ${i===selectedHero?'selected':''}" data-hero="${i}"><img src="${ROOT+h.stand}" alt=""><b>${h.name.replace('・','<br>')}</b></button>`).join('')}\nfunction renderDex(){const d=collection(),found=Object.keys(d).length;$('#dexCount').textContent=`発見 ${found} / ${allMonsters.length} 体　倒した数をバッジに記録中！`;$('#dexGrid').innerHTML=allMonsters.map(e=>{const n=d[monsterKey(e)]||0;return `<article class="badge ${n?'found':''}"><img src="${ROOT+e[1]}" alt=""><b>${n?e[0]:'？？？'}</b><small>${n?`撃破 ${n}回`:'まだ未発見'}</small></article>`}).join('')}
const rnd=n=>Math.floor(Math.random()*n);function record(){const d=JSON.parse(localStorage.getItem('warizanBattleV3')||'{"best":0,"clears":0}');$('#best').textContent=d.best||0;$('#clears').textContent=d.clears||0}
function makeProblem(){let divisor,quotient,remainder,dividend,need=state.level===1?2:rnd(2)+2;do{divisor=rnd(8)+2;quotient=state.level===3?rnd(80)+20:rnd(80)+10;remainder=state.level===1?0:rnd(divisor);dividend=divisor*quotient+remainder}while(String(dividend).length!==need||String(quotient).length<2||(state.level===3&&!String(quotient).includes('0')));return{dividend,divisor}}
function stagesOf(dividend,divisor){const digits=[...String(dividend)].map(Number);let acc=0,start=-1,stages=[];for(let i=0;i<digits.length;i++){acc=acc*10+digits[i];if(start<0&&acc<divisor)continue;if(start<0)start=i;const q=Math.floor(acc/divisor),p=q*divisor,r=acc-p;stages.push({end:i,current:acc,q,partial:p,remainder:r});acc=r}return{digits,start,stages}}
function stepList(m){let a=[];m.stages.forEach((s,i)=>{a.push({kind:'tateru',stage:i,answer:String(s.q),text:`${s.current} を ${m.divisor} でわると、商はいくつ？`});a.push({kind:'kakeru',stage:i,answer:String(s.partial),text:`${m.divisor} × ${s.q} はいくつ？`});a.push({kind:'hiku',stage:i,answer:String(s.remainder),text:`${s.current} − ${s.partial} はいくつ？`});if(i<m.stages.length-1)a.push({kind:'orosu',stage:i,answer:String(m.digits[s.end+1]),text:`${m.digits[s.end+1]} をおろそう。何をおろす？`})});return a}
function cell(r,c,cls='',txt=''){const x=document.createElement('div');x.className='cell '+cls;x.style.gridRow=r;x.style.gridColumn=c;x.textContent=txt;return x}function put(b,r,right,value,cls){const s=String(value),start=right-s.length+1;for(let i=0;i<s.length;i++)b.append(cell(r,start+i,cls,s[i]))}
function render(){const m=state.model,b=$('#board'),cols=String(m.divisor).length+1+m.digits.length,rows=2+m.stages.length*2;b.innerHTML='';b.style.gridTemplateColumns=`repeat(${cols},var(--unit))`;b.style.gridTemplateRows=`repeat(${rows},var(--unit))`;const start=String(m.divisor).length+2;put(b,2,String(m.divisor).length,m.divisor,'');b.append(cell(2,String(m.divisor).length+1,'bracket'));m.digits.forEach((d,i)=>b.append(cell(2,start+i,'source topline',d)));const done=state.steps.slice(0,state.index),cur=state.steps[state.index];m.stages.forEach((s,i)=>{const rp=3+i*2,rr=rp+1,right=start+s.end,has=k=>done.some(x=>x.stage===i&&x.kind===k),act=cur&&cur.stage===i?cur.kind:'';if(has('tateru'))put(b,1,right,s.q,'q');else if(act==='tateru')b.append(cell(1,right,'q focus','？'));if(has('kakeru'))put(b,rp,right,s.partial,'partial');else if(act==='kakeru')put(b,rp,right,'？','partial focus');for(let c=right-String(s.partial).length+1;c<=right;c++)b.append(cell(rr,c,'subline'));if(has('hiku')){put(b,rr,right,s.remainder,'remain');const ds=done.find(x=>x.stage===i&&x.kind==='orosu');if(ds)b.append(cell(rr,right+1,'source down',ds.answer))}else if(act==='hiku')put(b,rr,right,'？','remain focus');if(act==='orosu')b.append(cell(rr,right+1,'source focus down','？'))})}
function setMessage(){const s=state.steps[state.index];if(!s)return;$('#message').textContent=`${state.question+1}問目　${s.text}`;$('#answer').textContent=state.answer||'　';$('#answer').className='answer-box';all('.step-chip').forEach(x=>{x.classList.toggle('active',x.dataset.kind===s.kind);x.classList.toggle('done',state.steps.slice(0,state.index).some(y=>y.kind===x.dataset.kind))});$('#progress').textContent=`${state.question+1} / ${state.total} 問`}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1200)}
function resetHero(){if(state.heroData)$('#heroArt').src=ROOT+state.heroData.stand;const f=$('#heroFighter');f.classList.remove('attack','attack-burst','damage');clearTimeout(state.attackTimer)}
function heroAttack(){const f=$('#heroFighter');$('#heroArt').src=ROOT+state.heroData.attack;f.classList.add('attack');f.classList.remove('attack-burst');void f.offsetWidth;f.classList.add('attack-burst');clearTimeout(state.attackTimer);state.attackTimer=setTimeout(()=>f.classList.remove('attack-burst'),260)}
function heroDamage(){const f=$('#heroFighter');f.classList.add('damage');setTimeout(()=>f.classList.remove('damage'),320)}
function startQuestion(){sound('questionStart',.1);resetHero();const p=makeProblem(),d=stagesOf(p.dividend,p.divisor);state.model={...p,...d};state.steps=stepList(state.model);state.index=0;state.answer='';const pool=WORLDS[state.level].enemies,e=pool[rnd(pool.length)];state.currentEnemy=e;$('#enemyArt').src=ROOT+e[1];$('#enemyName').textContent=e[0];state.enemy=100;$('#enemyHp').style.width='100%';render();setMessage()}
function startBattle(){sound('start');state.question=0;state.combo=0;state.maxCombo=0;state.misses=0;state.hero=100;state.heroData=HEROES[selectedHero];$('#heroArt').src=ROOT+state.heroData.stand;$('#heroName').textContent=state.heroData.name;$('#resultHero').src=ROOT+state.heroData.attack;$('#heroHp').style.width='100%';$('#battle').style.setProperty('--battle-bg',`url('${ROOT+WORLDS[state.level].bg}')`);$('#result').classList.remove('show');$('.screen.active')?.classList.remove('active');$('#game').classList.add('active');startQuestion()}
function wrong(){sound('wrong',.12);state.misses++;state.combo=0;$('#combo').textContent='⚡ 0 コンボ';state.hero=Math.max(0,state.hero-10);$('#heroHp').style.width=state.hero+'%';resetHero();heroDamage();$('#answer').classList.add('bad');setTimeout(()=>{state.answer='';setMessage()},350);toast('おしい！ マスを見て、もう一度。')}
function advance(){sound('correct',.12);heroAttack();state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);$('#combo').textContent=`⚡ ${state.combo} コンボ`;state.index++;state.answer='';state.enemy=Math.max(0,state.enemy-100/state.steps.length);$('#enemyHp').style.width=state.enemy+'%';if(state.index>=state.steps.length){unlockMonster(state.currentEnemy);state.question++;if(state.question>=state.total){const old=JSON.parse(localStorage.getItem('warizanBattleV3')||'{"best":0,"clears":0}');localStorage.setItem('warizanBattleV3',JSON.stringify({best:Math.max(old.best||0,state.maxCombo),clears:(old.clears||0)+1}));record();sound('clear',.16);$('#resultText').textContent=`最高 ${state.maxCombo} コンボ！ ${state.heroData.name} と一緒に、筆算の4ステップをクリア！`;setTimeout(()=>$('#result').classList.add('show'),350);return}toast('撃破！ 次のモンスターだ！');setTimeout(startQuestion,480);return}render();setMessage()}
function enter(){const s=state.steps[state.index];if(!s)return;if(state.answer===s.answer){$('#answer').classList.add('ok');setTimeout(advance,160)}else wrong()}
function hint(){sound('hint',.1);const s=state.steps[state.index],m=state.model;if(s.kind==='tateru')toast(`${m.divisor} がいくつ入るか考えよう。`);else if(s.kind==='kakeru')toast(`わる数 ${m.divisor} と商をかけるよ。`);else if(s.kind==='hiku')toast('上の数から、かけた答えをひくよ。');else toast('次の数字を下へおろすよ。')}
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'けす',0,'決定'].map(n=>`<button class="key ${n==='決定'?'enter':n==='けす'?'erase':''}" data-key="${n}">${n==='けす'?'⌫':n==='決定'?'✓':n}</button>`).join('');$('#keys').onclick=e=>{const k=e.target.dataset.key;if(!k)return;if(k==='決定')enter();else if(k==='けす'){state.answer=state.answer.slice(0,-1);setMessage()}else{state.answer=(state.answer+k).slice(-3);setMessage()}};$('#hint').onclick=hint;document.addEventListener('keydown',e=>{if(!$('#game').classList.contains('active')||$('#result').classList.contains('show'))return;if(/^\d$/.test(e.key)){state.answer=(state.answer+e.key).slice(-3);setMessage()}else if(e.key==='Backspace'){state.answer=state.answer.slice(0,-1);setMessage()}else if(e.key==='Enter')enter()});$('#start').onclick=startBattle;$('#startHero').onclick=startBattle;$('#heroChoices').onclick=e=>{const b=e.target.closest('[data-hero]');if(!b)return;selectedHero=Number(b.dataset.hero);localStorage.setItem('warizanSelectedHero',selectedHero);renderHeroChoices()};$('#dexOpen').onclick=()=>{$('#dex').classList.add('show');renderDex()};$('#dexClose').onclick=()=>$('#dex').classList.remove('show');$('#again').onclick=startBattle;$('#homeBtn').onclick=()=>{$('#game').classList.remove('active');$('#home').classList.add('active')};$('#resultHome').onclick=()=>{$('#result').classList.remove('show');$('#game').classList.remove('active');$('#home').classList.add('active')};$('#levels').onclick=e=>{const b=e.target.closest('[data-level]');if(!b)return;state.level=Number(b.dataset.level);all('.level-card').forEach(x=>x.classList.toggle('selected',x===b))};$('#soundToggle').onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem('warizanBattleSound',soundEnabled?'on':'off');$('#soundToggle').textContent=soundEnabled?'🔊':'🔇'};record();renderHeroChoices();$('#soundToggle').textContent=soundEnabled?'🔊':'🔇';
</script>
</body></html>
