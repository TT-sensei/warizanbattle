<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>わり算バトル　筆算アドベンチャー</title>
  <style>
    :root{--ink:#18263b;--paper:#fffdf8;--sky:#edf7ff;--blue:#2774d8;--orange:#f39a32;--green:#20a575;--red:#d75454;--yellow:#fff1a6;--line:#b8cadc}
    *{box-sizing:border-box} body{margin:0;background:var(--sky);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100svh} button{font:inherit;font-weight:800;cursor:pointer} .screen{display:none;min-height:100svh}.screen.active{display:flex}
    #home{align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#cceaff,#fef6cf)}.home-inner{width:min(800px,100%);text-align:center}.logo{font-size:clamp(31px,8vw,54px);margin:0;color:#e87524;text-shadow:2px 2px #fff}.sub{font-weight:700;color:#35617e;margin:8px 0 22px}.record{margin:auto auto 22px;background:#ffffffdb;border:2px solid #b8dbef;border-radius:18px;padding:12px;max-width:450px}.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level-card{border:3px solid #d6e4ee;background:#fff;border-radius:18px;padding:16px 8px;color:var(--ink);min-height:134px}.level-card.selected{border-color:var(--blue);background:#eef7ff;box-shadow:0 5px 0 #bfd7ee}.level-card b{display:block;font-size:18px}.level-card small{display:block;margin-top:8px;line-height:1.45}.start{margin-top:24px;border:0;border-radius:999px;background:linear-gradient(#ffad4c,#eb7f1e);color:#fff;font-size:24px;padding:16px 52px;box-shadow:0 5px 0 #b75a16}.start:active,.key:active,.soft:active{transform:translateY(3px);box-shadow:none}
    #game{flex-direction:column;overflow:hidden}.top{background:#fff;padding:9px 14px;border-bottom:2px solid #c5dfef;display:flex;gap:10px;align-items:center;justify-content:space-between}.back,.soft{border:0;border-radius:10px;background:#e9f0f6;color:#28445d;padding:9px 12px}.progress{font-weight:800}.stars{color:#d98116}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;padding:8px 12px;border-bottom:1px solid #d7e3ed}.step-chip{padding:8px 3px;text-align:center;border-radius:999px;font-size:clamp(11px,2.7vw,15px);font-weight:800;background:#eef2f6;color:#778494}.step-chip.active{background:var(--yellow);color:#594000;box-shadow:inset 0 0 0 2px #e6c855}.step-chip.done{background:#dff5e9;color:#15704c}
    .battle{flex:1;min-height:0;display:grid;grid-template-columns:minmax(56px,.5fr) minmax(250px,4fr) minmax(56px,.5fr);align-items:center;gap:7px;padding:8px;background:linear-gradient(165deg,#d5f0ff,#fff4d0)}.fighter{text-align:center;font-size:clamp(30px,7vw,58px)}.fighter small{display:block;font-size:11px;font-weight:800}.hp{height:11px;border:2px solid #fff;background:#4b5563;border-radius:99px;overflow:hidden;margin:4px auto;width:85%}.hp i{display:block;height:100%;background:#df5656;width:100%;transition:.25s}.hero .hp i{background:#31b77a}.board-card{background:var(--paper);border:3px solid #6683a0;border-radius:17px;padding:clamp(6px,2vw,16px);box-shadow:0 6px 0 #b6cad8;overflow:auto;max-width:100%}.board{--unit:clamp(38px,9vw,74px);display:grid;grid-auto-rows:var(--unit);min-width:max-content;position:relative}.cell{width:var(--unit);height:var(--unit);display:flex;align-items:center;justify-content:center;border-right:1px solid #e2ebf2;border-bottom:1px solid #e2ebf2;font-size:clamp(25px,6vw,48px);font-weight:800;position:relative}.source{color:var(--blue)}.q{color:#7d4a15}.partial{color:var(--green)}.remain{color:var(--red)}.bracket{border-top:3px solid var(--ink);font-size:clamp(32px,7vw,57px);justify-content:flex-start}.bracket:before{content:"）";position:absolute;left:-16px;top:-2px}.topline{border-top:3px solid var(--ink)}.subline{border-top:3px solid var(--ink)}.focus{background:var(--yellow);outline:3px solid #f0c943;z-index:2}.down:after{content:"↓";position:absolute;font-size:18px;color:#147eb5;top:-5px;right:2px}.msg{min-height:58px;background:#fff;padding:9px 14px;text-align:center;font-weight:800;font-size:clamp(15px,3.8vw,20px);border-top:2px solid #c5dfef}.answer{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;padding:8px 14px;border-top:1px solid #dce7ef}.answer-label{font-weight:800}.answer-box{min-width:100px;text-align:center;border:3px dashed #8aa3b7;border-radius:10px;font-size:28px;padding:3px 12px;letter-spacing:3px;height:46px}.answer-box.bad{border-color:#df6262;background:#fff0f0;animation:shake .25s linear}.answer-box.ok{border-color:#43aa78;background:#effaf4}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .keys{background:#edf3f8;padding:8px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.key{border:0;border-radius:12px;background:#fff;color:#263d51;height:50px;font-size:22px;box-shadow:0 3px 0 #afc5d5}.key.enter{background:#39b477;color:#fff}.key.erase{background:#a4b3bf;color:#fff}.toast{position:fixed;top:116px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 18px;border-radius:999px;background:#1f3650;color:#fff;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.result{position:fixed;inset:0;background:#18334bc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.result.show{display:flex}.result-card{background:#fffdf8;text-align:center;border-radius:22px;padding:28px;max-width:350px;width:100%;box-shadow:0 10px 40px #0005}.result h2{margin-top:0;color:#e27d22}
    @media(max-width:430px){.level-grid{gap:7px}.level-card{padding:12px 4px;min-height:122px}.level-card b{font-size:15px}.battle{grid-template-columns:48px minmax(0,1fr) 48px}.keys{grid-template-columns:repeat(6,1fr);gap:5px}.key{height:46px;font-size:20px}}
  </style>
</head>
<body>
  <main id="home" class="screen active"><div class="home-inner">
    <h1 class="logo">わり算バトル</h1><p class="sub">筆算の「たてる・かける・ひく・おろす」を、順番にマスターしよう！</p>
    <div class="record">🏅 これまでの最高コンボ：<span id="best">0</span>　　⭐ クリアしたバトル：<span id="clears">0</span></div>
    <div class="level-grid" id="levels">
      <button class="level-card selected" data-level="1"><b>はじめの森</b><small>2けた ÷ 1けた<br>あまりなし</small></button>
      <button class="level-card" data-level="2"><b>あまりの洞くつ</b><small>2・3けた ÷ 1けた<br>あまりあり</small></button>
      <button class="level-card" data-level="3"><b>名人の城</b><small>3けた ÷ 1けた<br>商に0も出る</small></button>
    </div>
    <button id="start" class="start">バトルスタート！</button>
  </div></main>
  <main id="game" class="screen">
    <div class="top"><button id="homeBtn" class="back">← もどる</button><span class="progress" id="progress"></span><span class="stars" id="combo">⚡ 0 コンボ</span></div>
    <div class="steps"><span class="step-chip" data-kind="tateru">① たてる</span><span class="step-chip" data-kind="kakeru">② かける</span><span class="step-chip" data-kind="hiku">③ ひく</span><span class="step-chip" data-kind="orosu">④ おろす</span></div>
    <section class="battle"><aside class="fighter hero">🧑‍🚀<div class="hp"><i id="heroHp"></i></div><small>きみ</small></aside><div class="board-card"><div id="board" class="board"></div></div><aside class="fighter">👾<div class="hp"><i id="enemyHp"></i></div><small id="enemyName">わりザウルス</small></aside></section>
    <div id="message" class="msg"></div><div class="answer"><span class="answer-label">こたえ</span><div id="answer" class="answer-box">　</div><button id="hint" class="soft">ヒント</button></div>
    <div class="keys" id="keys"></div><div id="toast" class="toast"></div>
  </main>
  <div id="result" class="result"><div class="result-card"><h2>バトルクリア！🎉</h2><p id="resultText"></p><button id="again" class="start" style="font-size:18px;padding:13px 30px">つぎのバトルへ</button><br><button id="resultHome" class="soft" style="margin-top:12px">ホームへ</button></div></div>
  <script>
  (()=>{
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const state={level:1,question:0,total:5,steps:[],index:0,answer:'',combo:0,maxCombo:0,hero:100,enemy:100,model:null};
    const save=()=>localStorage.setItem('warizanBattleV2',JSON.stringify({best:Math.max(Number(localStorage.getItem('warizanBattleV2')?JSON.parse(localStorage.getItem('warizanBattleV2')).best:0),state.maxCombo),clears:(JSON.parse(localStorage.getItem('warizanBattleV2')||'{}').clears||0)+1}));
    function record(){const d=JSON.parse(localStorage.getItem('warizanBattleV2')||'{"best":0,"clears":0}');$('#best').textContent=d.best||0;$('#clears').textContent=d.clears||0}
    function random(n){return Math.floor(Math.random()*n)}
    function makeProblem(){let divisor,quotient,remainder,dividend,need=state.level===1?2:random(2)+2;do{divisor=random(8)+2;quotient=state.level===3?random(80)+20:random(80)+10;remainder=state.level===1?0:random(divisor);dividend=divisor*quotient+remainder}while(String(dividend).length!==need||String(quotient).length<2||(state.level===3&&!String(quotient).includes('0')));return {dividend,divisor}}
    function stagesOf(dividend,divisor){const digits=String(dividend).split('').map(Number);let acc=0,start=-1,stages=[];for(let i=0;i<digits.length;i++){acc=acc*10+digits[i];if(start<0&&acc<divisor)continue;if(start<0)start=i;const q=Math.floor(acc/divisor),p=q*divisor,r=acc-p;stages.push({end:i,current:acc,q,partial:p,remainder:r});acc=r}return {digits,start,stages}}
    function stepList(model){let a=[];model.stages.forEach((s,i)=>{a.push({kind:'tateru',stage:i,answer:String(s.q),text:`${s.current} を ${model.divisor} でわると、商はいくつ？`});a.push({kind:'kakeru',stage:i,answer:String(s.partial),text:`${model.divisor} × ${s.q} はいくつ？`});a.push({kind:'hiku',stage:i,answer:String(s.remainder),text:`${s.current} − ${s.partial} はいくつ？`});if(i<model.stages.length-1)a.push({kind:'orosu',stage:i,answer:String(model.digits[s.end+1]),text:`${model.digits[s.end+1]} をおろそう。何をおろす？`})});return a}
    function cell(r,c,cls='',txt=''){const x=document.createElement('div');x.className='cell '+cls;x.style.gridRow=r;x.style.gridColumn=c;x.textContent=txt;return x}
    function putValue(board,r,right,value,cls,focus=false){const s=String(value),start=right-s.length+1;for(let i=0;i<s.length;i++)board.append(cell(r,start+i,cls+(focus?' focus':''),s[i]));return {start,end:right}}
    function render(){const m=state.model,b=$('#board'),cols=String(m.divisor).length+1+m.digits.length,rows=2+m.stages.length*2;b.innerHTML='';b.style.gridTemplateColumns=`repeat(${cols},var(--unit))`;b.style.gridTemplateRows=`repeat(${rows},var(--unit))`;const start=String(m.divisor).length+2;putValue(b,2,String(m.divisor).length,m.divisor,'');b.append(cell(2,String(m.divisor).length+1,'bracket'));m.digits.forEach((d,i)=>b.append(cell(2,start+i,'source topline',d)));
      const completed=state.steps.slice(0,state.index),current=state.steps[state.index];
      m.stages.forEach((s,i)=>{const rowP=3+i*2,rowR=rowP+1,right=start+s.end;const has=k=>completed.some(x=>x.stage===i&&x.kind===k);const active=current&&current.stage===i?current.kind:'';if(has('tateru'))putValue(b,1,right,s.q,'q',active==='tateru');else if(active==='tateru')b.append(cell(1,right,'q focus','？'));if(has('kakeru'))putValue(b,rowP,right,s.partial,'partial',active==='kakeru');else if(active==='kakeru')putValue(b,rowP,right,'？','partial focus');const pLen=String(s.partial).length;for(let c=right-pLen+1;c<=right;c++){const line=cell(rowR,c,'subline');b.append(line)}if(has('hiku')){putValue(b,rowR,right,s.remainder,'remain',active==='hiku');const downStep=completed.find(x=>x.stage===i&&x.kind==='orosu');if(downStep){b.append(cell(rowR,right+1,'source down',downStep.answer))}}else if(active==='hiku')putValue(b,rowR,right,'？','remain focus');if(active==='orosu')b.append(cell(rowR,right+1,'source focus down','？'))})
    }
    function setMessage(){const s=state.steps[state.index];if(!s)return;$('#message').textContent=`${state.question+1}問目　${s.text}`;$('#answer').textContent=state.answer||'　';$('#answer').className='answer-box';$$('.step-chip').forEach(x=>x.classList.toggle('active',x.dataset.kind===s.kind));$$('.step-chip').forEach(x=>x.classList.toggle('done',state.steps.slice(0,state.index).some(y=>y.kind===x.dataset.kind)));$('#progress').textContent=`${state.question+1} / ${state.total} 問`}
    function showToast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
    function startQuestion(){const p=makeProblem(),d=stagesOf(p.dividend,p.divisor);state.model={...p,...d};state.steps=stepList(state.model);state.index=0;state.answer='';$('#enemyName').textContent=['わりザウルス','ひっさんドラゴン','あまりゴブリン'][random(3)];render();setMessage()}
    function startBattle(){state.question=0;state.combo=0;state.maxCombo=0;state.hero=100;state.enemy=100;$('#heroHp').style.width='100%';$('#enemyHp').style.width='100%';$('#result').classList.remove('show');$('.screen.active').classList.remove('active');$('#game').classList.add('active');startQuestion()}
    function wrong(){state.combo=0;state.hero=Math.max(0,state.hero-10);$('#heroHp').style.width=state.hero+'%';const a=$('#answer');a.classList.add('bad');setTimeout(()=>{state.answer='';setMessage()},350);showToast('おしい！　筆算のマスを見て、もう一度。')}
    function advance(){state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);$('#combo').textContent=`⚡ ${state.combo} コンボ`;state.index++;state.answer='';state.enemy=Math.max(0,state.enemy-100/state.steps.length);$('#enemyHp').style.width=state.enemy+'%';if(state.index>=state.steps.length){state.question++;if(state.question>=state.total){const old=JSON.parse(localStorage.getItem('warizanBattleV2')||'{"best":0,"clears":0}');localStorage.setItem('warizanBattleV2',JSON.stringify({best:Math.max(old.best||0,state.maxCombo),clears:(old.clears||0)+1}));record();$('#resultText').textContent=`最高 ${state.maxCombo} コンボ！　筆算の4つのステップを最後まで進められたね。`;$('#result').classList.add('show');return}showToast('ナイス！ 次のモンスターだ！');setTimeout(startQuestion,500);return}render();setMessage()}
    function enter(){const s=state.steps[state.index];if(!s)return;if(state.answer===s.answer){$('#answer').classList.add('ok');setTimeout(advance,180)}else wrong()}
    function hint(){const s=state.steps[state.index],m=state.model;if(s.kind==='tateru')showToast(`「${s.stage?m.stages[s.stage].current:m.stages[0].current} の中に ${m.divisor} がいくつ」を考えよう。`);else if(s.kind==='kakeru')showToast(`わる数 ${m.divisor} と、商をかけるよ。`);else if(s.kind==='hiku')showToast('上の数から、かけた答えをひくよ。');else showToast('わられる数の、次の数字を下へおろすよ。')}
    $('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'けす',0,'決定'].map(n=>`<button class="key ${n==='決定'?'enter':n==='けす'?'erase':''}" data-key="${n}">${n==='けす'?'⌫':n==='決定'?'✓':n}</button>`).join('');$('#keys').addEventListener('click',e=>{const k=e.target.dataset.key;if(!k)return;if(k==='決定')enter();else if(k==='けす'){state.answer=state.answer.slice(0,-1);setMessage()}else{state.answer=(state.answer+k).slice(-3);setMessage()}});$('#hint').onclick=hint;$('#start').onclick=startBattle;$('#again').onclick=startBattle;$('#homeBtn').onclick=()=>{$('#game').classList.remove('active');$('#home').classList.add('active')};$('#resultHome').onclick=()=>{$('#result').classList.remove('show');$('#game').classList.remove('active');$('#home').classList.add('active')};$('#levels').onclick=e=>{const b=e.target.closest('[data-level]');if(!b)return;state.level=Number(b.dataset.level);$$('.level-card').forEach(x=>x.classList.toggle('selected',x===b))};record();
  })();
  </script>
</body></html>
